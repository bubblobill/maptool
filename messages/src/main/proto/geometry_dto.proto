syntax = "proto3";

package maptool;

option java_multiple_files = true;
option java_package = "net.rptools.maptool.server.proto.geometry";
option java_outer_classname = "GeometryDtoProtos";

import "google/protobuf/wrappers.proto";

/*
 * For easier differentiation between protobuf classes and "normal" classes
 * protobuf classes end with "Dto" or "Msg".
 */

message GeometryDto {
  bytes geometry = 1;
  string data = 2;
}

message GeometryCollectionDto {
  repeated GeometryDto geometries = 1;
}